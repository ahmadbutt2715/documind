{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DocuMind — Sign Up</title>
    <link rel="stylesheet" href="{% static 'chat/chat.css' %}">
    <link rel="stylesheet" href="{% static 'accounts/auth.css' %}">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="logo">
                <div class="logo-icon">D</div>
                <span>Docu<span>Mind</span></span>
            </div>

            <h1>Create your account</h1>
            <p class="auth-subtitle">Start chatting with your documents.</p>

            {% if form.errors %}
                <div class="auth-error">
                    {% for field in form %}
                        {% for error in field.errors %}<p>{{ error }}</p>{% endfor %}
                    {% endfor %}
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <label>Username</label>
                <input type="text" name="username" required autofocus>

                <label>Password</label>
                <input type="password" name="password1" required>

                <label>Confirm Password</label>
                <input type="password" name="password2" required>

                <button type="submit" class="auth-submit">Sign Up</button>
            </form>

            <p class="auth-switch">
                Already have an account? <a href="{% url 'login' %}">Log in</a>
            </p>
        </div>
    </div>
</body>
</html>
